<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐴 로그인 | SRSystem — 시안 C</title>
  <script>(function(){try{var t=localStorage.getItem('epTheme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="assets/auth.css">
  <style>
    /* 시안 C — Poster : 다크 포스터 + 대형 톤온톤 타이포 + 플로팅 카드 */
    body.v-c { --c-poster: #0F0F0F; background: var(--c-poster); }
    .c-page { position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; color: #FFFFFF; display: grid; grid-template-rows: auto 1fr; }

    .c-type {
      position: absolute; left: 2.4vw; bottom: -0.2em; z-index: 0;
      font-size: 21.5vw; font-weight: var(--weight-semibold);
      line-height: 1; letter-spacing: -0.065em; white-space: nowrap;
      pointer-events: none; user-select: none;
    }
    .c-type span { color: var(--color-primary); }
    .c-type span:nth-child(3) { opacity: .6; }
    .c-type span:nth-child(4) { opacity: .38; }
    .c-type span:nth-child(5) { opacity: .22; }
    .c-type span:nth-child(6) { opacity: .13; }
    .c-type span:nth-child(7) { opacity: .08; }
    .c-type span:nth-child(8) { opacity: .06; }
    @media (prefers-reduced-motion: no-preference) {
      .c-type span { animation: c-letter 1s cubic-bezier(.2,.8,.2,1) backwards; }
      .c-type span:nth-child(2) { animation-delay: .05s; } .c-type span:nth-child(3) { animation-delay: .10s; }
      .c-type span:nth-child(4) { animation-delay: .15s; } .c-type span:nth-child(5) { animation-delay: .20s; }
      .c-type span:nth-child(6) { animation-delay: .25s; } .c-type span:nth-child(7) { animation-delay: .30s; }
      .c-type span:nth-child(8) { animation-delay: .35s; }
    }
    @keyframes c-letter { from { opacity: 0; transform: translateY(12%); } }
    .c-type span { display: inline-block; }

    .c-top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 var(--space-6) 0 var(--space-12); }
    .v-c .icon-btn { background: transparent; border-color: rgba(255,255,255,0.16); color: rgba(255,255,255,0.72); }
    .v-c .icon-btn:hover { border-color: var(--color-primary); color: #FFFFFF; }

    .c-main {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: minmax(0, 1fr) 440px;
      align-items: start; gap: var(--space-16);
      width: 100%; max-width: 1440px; margin: 0 auto;
      padding: 9vh var(--space-16) var(--space-12) var(--space-12);
    }
    .c-kicker { font-size: 12px; font-weight: var(--weight-semibold); letter-spacing: 0.16em; color: var(--color-primary); }
    .c-title {
      margin-top: var(--space-5);
      font-size: calc(var(--text-4xl) * 1.5);
      font-weight: var(--weight-semibold);
      line-height: 1.22; letter-spacing: -0.035em;
    }
    .c-sub { margin-top: var(--space-5); font-size: var(--text-base); color: rgba(255,255,255,0.64); }
    .c-flow { list-style: none; display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-10); font-size: var(--text-sm); color: rgba(255,255,255,0.78); }
    .c-flow li { display: inline-flex; align-items: center; gap: var(--space-2); }
    .c-flow li + li::before { content: ''; width: 20px; height: 1px; margin-right: var(--space-1); background: rgba(255,255,255,0.22); }
    .c-flow .pie { width: 16px; height: 16px; --ink: var(--color-primary); --track: rgba(255,255,255,0.14); }
    @media (prefers-reduced-motion: no-preference) {
      .c-flow .pie { animation: c-pie 1.2s cubic-bezier(.2,.8,.2,1) backwards; }
      .c-flow li:nth-child(1) .pie { animation-delay: .45s; }
      .c-flow li:nth-child(2) .pie { animation-delay: .6s; }
      .c-flow li:nth-child(3) .pie { animation-delay: .75s; }
      .c-flow li:nth-child(4) .pie { animation-delay: .9s; }
    }
    @keyframes c-pie { from { --p: 0; } }

    .c-card {
      padding: var(--space-10);
      border-radius: var(--radius-xl);
      background: var(--color-bg);
      color: var(--color-text-primary);
      box-shadow: 0 48px 96px -32px rgba(0,0,0,0.75);
    }
    .c-card .auth-form { max-width: none; }
    [data-theme="dark"] .c-card { background: var(--color-bg-subtle); box-shadow: 0 0 0 1px var(--color-border), 0 48px 96px -32px rgba(0,0,0,0.9); }

    @media (max-width: 1100px) {
      .c-main { grid-template-columns: minmax(0, 440px); justify-content: center; padding: var(--space-6) var(--space-6) 34vw; }
      .c-intro { display: none; }
      .c-top { padding: 0 var(--space-3) 0 var(--space-6); }
      .c-type { font-size: 27vw; }
    }
    @media (max-width: 640px) {
      .c-main { padding: var(--space-2) var(--space-4) 40vw; }
      .c-card { padding: var(--space-8) var(--space-6) var(--space-6); }
    }
  </style>
</head>
<body class="auth-page v-c" data-variant="c">
  <div class="c-page">
    <div class="c-type" aria-hidden="true" data-poster-type><span>S</span><span>R</span><span>S</span><span>y</span><span>s</span><span>t</span><span>e</span><span>m</span></div>

    <header class="c-top">
      <a class="product product--on-color" href="#" aria-label="SRSystem 홈">
        <svg class="product-logo" role="img" aria-label="Poly"><use href="#poly-wordmark"/></svg>
        <span class="product-sep" aria-hidden="true"></span>
        <span class="product-name">SRSystem</span>
      </a>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="다크 모드로 전환"></button>
    </header>

    <main class="c-main">
      <section class="c-intro" aria-label="SRSystem 소개">
        <p class="c-kicker">SERVICE REQUEST SYSTEM</p>
        <h2 class="c-title">필요한 일은<br>요청 한 번으로.</h2>
        <p class="c-sub">캠퍼스 SR 등록·조회부터 처리 현황 확인까지.</p>
        <ol class="c-flow" aria-label="SR 진행 단계">
          <li><i class="pie" style="--p:25"></i>요청</li>
          <li><i class="pie" style="--p:50"></i>접수</li>
          <li><i class="pie" style="--p:75"></i>처리</li>
          <li><i class="pie" style="--p:100"></i>완료</li>
        </ol>
      </section>
      <section class="c-card">
        <div class="auth-form auth-enter">
          <div class="auth-head">
            <span class="auth-accent" aria-hidden="true"></span>
            <h1 class="auth-title">로그인</h1>
            <p class="auth-desc">SRSystem 계정으로 로그인하세요.</p>
          </div>

          <div class="auth-alert" id="loginAlert" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div><strong>아이디 또는 비밀번호가 일치하지 않습니다.</strong><p>입력한 내용을 다시 확인해 주세요.</p></div>
          </div>

          <form id="loginForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="loginId">아이디</label>
              <input class="form-input" id="loginId" name="loginId" type="text" autocomplete="username" placeholder="아이디를 입력하세요" required aria-describedby="loginIdError">
              <p class="field-error" id="loginIdError"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>아이디를 입력해 주세요.</p>
            </div>
            <div class="form-group">
              <label class="form-label" for="password">비밀번호</label>
              <div class="input-affix">
                <input class="form-input" id="password" name="password" type="password" maxlength="20" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required aria-describedby="passwordError">
                <span class="badge badge-warning caps-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18v-6H5l7-7 7 7h-4v6H9z"/></svg>Caps Lock</span>
                <button type="button" class="affix-btn" id="pwToggle" aria-label="비밀번호 표시" aria-pressed="false"></button>
              </div>
              <p class="field-error" id="passwordError"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>비밀번호를 입력해 주세요.</p>
            </div>
            <div class="auth-row">
              <label class="check"><input type="checkbox" id="rememberId"><span class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span>아이디 저장</label>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginSubmit"><span class="btn-spinner" aria-hidden="true"></span><span class="btn-label">로그인</span></button>
          </form>

          <div class="or" role="separator">또는</div>

          <button type="button" class="btn btn-secondary btn-block btn-google" id="googleLogin">
            <span class="btn-spinner" aria-hidden="true"></span><svg class="g-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg><span class="btn-label">Google 계정으로 로그인</span><span class="badge badge-neutral g-domain" title="@edu-poly.com 메일 소속 직원만 사용할 수 있습니다">@edu-poly.com</span>
          </button>

          <div class="auth-help">
            <span>로그인이 안 되나요?</span>
            <button type="button" class="link-btn" id="openRequest">관리자에게 권한 요청<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/layout.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
