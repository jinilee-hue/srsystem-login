<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐴 로그인 | SRSystem — 시안 B</title>
  <script>(function(){try{var t=localStorage.getItem('epTheme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="assets/auth.css">
  <style>
    /* 시안 B — Sky : 톤온톤 하늘 + 흐르는 라인 위 중앙 카드 */
    body.v-b { background: var(--color-bg-subtle); }
    .b-sky {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background:
        radial-gradient(56% 48% at 50% 50%, var(--color-primary-a10), transparent 72%),
        radial-gradient(36% 40% at 92% 0%, var(--color-primary-a08), transparent 70%),
        radial-gradient(30% 36% at 4% 100%, var(--color-primary-a08), transparent 70%),
        linear-gradient(180deg, var(--color-bg-subtle) 0%, var(--color-bg) 100%);
    }
    .b-waves {
      position: absolute; left: -6%; bottom: -2%;
      width: 112%; height: 72%;
    }
    .b-waves path { fill: none; stroke: var(--color-primary); stroke-width: 1.2; vector-effect: non-scaling-stroke; }

    .b-page { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
    .b-top { display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 var(--space-6) 0 var(--space-10); }
    .b-main { display: grid; grid-template-columns: minmax(0, 460px); justify-content: center; align-items: center; padding: var(--space-6) var(--space-6) var(--space-10); }
    .b-card {
      width: 100%; max-width: 460px;
      padding: var(--space-10) var(--space-10) var(--space-8);
      border-radius: var(--radius-xl);
      background: var(--color-bg);
      border: 1px solid var(--color-primary-a10);
      box-shadow: 0 1px 2px rgba(17,24,39,0.04), 0 32px 64px -24px var(--color-primary-a25);
    }
    .b-card .auth-form { max-width: none; }
    .b-foot { display: flex; justify-content: center; gap: var(--space-2); padding: 0 var(--space-6) var(--space-6); font-size: 12px; color: var(--color-text-tertiary); }

    [data-theme="dark"] body.v-b { background: var(--color-bg); }
    [data-theme="dark"] .b-sky {
      background:
        radial-gradient(56% 48% at 50% 50%, var(--color-primary-a15), transparent 72%),
        radial-gradient(36% 40% at 92% 0%, var(--color-primary-a10), transparent 70%),
        linear-gradient(180deg, var(--color-bg) 0%, var(--color-bg) 100%);
    }
    [data-theme="dark"] .b-card { background: var(--color-bg-subtle); border-color: var(--color-border); box-shadow: 0 32px 80px -24px rgba(0,0,0,0.7); }

    @media (max-width: 640px) {
      .b-top { height: 60px; padding: 0 var(--space-3) 0 var(--space-5); }
      .b-main { padding: var(--space-2) var(--space-4) var(--space-8); align-items: start; grid-template-columns: minmax(0, 1fr); }
      .b-card { padding: var(--space-8) var(--space-6) var(--space-6); }
    }
  </style>
</head>
<body class="auth-page v-b" data-variant="b">
  <div class="b-sky" aria-hidden="true">
    <svg class="b-waves" viewBox="0 0 1440 600" preserveAspectRatio="none" data-sky-ribbon></svg>
  </div>

  <div class="b-page">
    <header class="b-top">
      <a class="product " href="#" aria-label="SRSystem 홈">
        <svg class="product-logo" role="img" aria-label="Poly"><use href="#poly-wordmark"/></svg>
        <span class="product-sep" aria-hidden="true"></span>
        <span class="product-name">SRSystem</span>
      </a>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="다크 모드로 전환"></button>
    </header>
    <main class="b-main">
      <section class="b-card">
        <div class="auth-form auth-enter">
          <div class="auth-head">
            <span class="auth-accent" aria-hidden="true"></span>
            <h1 class="auth-title">로그인</h1>
            <p class="auth-desc">SRSystem 계정으로 로그인하세요.</p>
          </div>

          <div class="auth-alert" id="loginAlert" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div><strong>아이디 또는 비밀번호가 일치하지 않습니다.</strong><p>입력한 내용을 다시 확인해 주세요.</p></div>
          </div>

          <form id="loginForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="loginId">아이디</label>
              <input class="form-input" id="loginId" name="loginId" type="text" autocomplete="username" placeholder="아이디를 입력하세요" required aria-describedby="loginIdError">
              <p class="field-error" id="loginIdError"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>아이디를 입력해 주세요.</p>
            </div>
            <div class="form-group">
              <label class="form-label" for="password">비밀번호</label>
              <div class="input-affix">
                <input class="form-input" id="password" name="password" type="password" maxlength="20" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required aria-describedby="passwordError">
                <span class="badge badge-warning caps-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18v-6H5l7-7 7 7h-4v6H9z"/></svg>Caps Lock</span>
                <button type="button" class="affix-btn" id="pwToggle" aria-label="비밀번호 표시" aria-pressed="false"></button>
              </div>
              <p class="field-error" id="passwordError"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>비밀번호를 입력해 주세요.</p>
            </div>
            <div class="auth-row">
              <label class="check"><input type="checkbox" id="rememberId"><span class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span>아이디 저장</label>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginSubmit"><span class="btn-spinner" aria-hidden="true"></span><span class="btn-label">로그인</span></button>
          </form>

          <div class="or" role="separator">또는</div>

          <button type="button" class="btn btn-secondary btn-block btn-google" id="googleLogin">
            <span class="btn-spinner" aria-hidden="true"></span><svg class="g-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg><span class="btn-label">Google 계정으로 로그인</span><span class="badge badge-neutral g-domain" title="@edu-poly.com 메일 소속 직원만 사용할 수 있습니다">@edu-poly.com</span>
          </button>

          <div class="auth-help">
            <span>로그인이 안 되나요?</span>
            <button type="button" class="link-btn" id="openRequest">관리자에게 권한 요청<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
          </div>
        </div>
      </section>
    </main>
    <footer class="b-foot"><span>© EduPoly</span><span aria-hidden="true">·</span><span>SRSystem</span></footer>
  </div>

  <script src="../js/layout.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
